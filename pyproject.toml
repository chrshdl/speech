[project]
name = "speech"
version = "0.1.0"
description = "End-to-end models for automatic speech recognition in PyTorch."
readme = "README.md"
requires-python = ">=3.13"
# What streaming with an exported model needs, such as on a Raspberry Pi.
# Training, evaluating PyTorch models and exporting them also need the
# train group, which uv installs by default.
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.4.2",
    "onnxruntime>=1.31.0",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
train = [
    "onnx>=1.23.2",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
]

[tool.uv]
default-groups = ["dev", "train"]
